<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- An aluminium frame around a blue screen, with the island playing music in the middle. -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset=".5" stop-color="#e3e5e9"/>
      <stop offset="1" stop-color="#cdd0d6"/>
    </linearGradient>
    <linearGradient id="frameEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ea3ad"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b7bff"/>
      <stop offset="1" stop-color="#2459e6"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#eef2fb"/>
    </linearGradient>
    <clipPath id="screen"><rect x="196" y="196" width="632" height="632" rx="112"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="inset" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="lift" x="-20%" y="-40%" width="140%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- the frame -->
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#frame)"/>
  </g>
  <rect x="101.500" y="101.500" width="821" height="821" rx="184.500" fill="none" stroke="url(#frameEdge)" stroke-width="3"/>
  <rect x="100.500" y="100.500" width="823" height="823" rx="185.500" fill="none" stroke="#000" stroke-opacity=".1" stroke-width="1"/>

  <!-- a bevel where the frame steps down to the screen -->
  <rect x="190" y="190" width="644" height="644" rx="118" fill="url(#bevel)"/>

  <!-- the screen -->
  <g clip-path="url(#screen)">
    <rect x="196" y="196" width="632" height="632" fill="url(#blue)"/>
    <rect x="196" y="196" width="632" height="632" rx="112" fill="none" stroke="#001a66" stroke-opacity=".35" stroke-width="22" filter="url(#inset)"/>
  </g>

  <!-- the island -->
  <g filter="url(#lift)">
    <rect x="302" y="440" width="420" height="144" rx="72" fill="url(#pill)"/>
  </g>
  <rect x="340" y="474" width="76" height="76" rx="20" fill="#2f6bf5"/>
  <g fill="#2f6bf5">
    <rect x="580" y="496" width="13" height="32" rx="6.500"/>
    <rect x="601" y="478" width="13" height="68" rx="6.500"/>
    <rect x="622" y="488" width="13" height="48" rx="6.500"/>
    <rect x="643" y="470" width="13" height="84" rx="6.500"/>
    <rect x="664" y="494" width="13" height="36" rx="6.500"/>
  </g>
</svg>
